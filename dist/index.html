er directly"],"correct":1,"explain":"The policy states that under exceptional circumstances, in the absence of the Regional Manager, the Deputy Regional Manager shall chair the Committee Meeting with the approval of the CCO."},{"q":"To whom are the Minutes of the Regional Compliance Meeting sent?","options":["The Sponsor Bank's Rural Banking Department","HO: Compliance Department","NABARD directly","The Board of Directors directly"],"correct":1,"explain":"The policy states the Minutes of Regional Compliance Meeting is to be sent to HO: Compliance Department."},{"q":"Which of the following is listed among the \"Mandatory members\" of the RLCC?","options":["Chief Compliance Officer","Sponsor Bank representative","Regional Compliance Officer (RCO)","Branch Manager"],"correct":2,"explain":"The policy's mandatory members list includes the Regional Manager and/or Deputy Regional Manager, the Regional Compliance Officer (RCO), the OMU Officer in-Charge, and an Officer from HO: Compliance Department."}]},{"topic":"Branch-Level Compliance, Reporting Structure & Circulars","questions":[{"q":"At branches, who performs the role of Compliance Officer?","options":["The Regional Compliance Officer","The Branch Manager (BM)","The Chief Compliance Officer","A designated clerk"],"correct":1,"explain":"The policy states that at branches, the BMs will be performing the role of Compliance Officer."},{"q":"Within how many days from the close of the quarter must the Branch Compliance Officer submit the Quarterly Compliance Certificate to the Regional Office?","options":["7 days","3 days","2 days","15 days"],"correct":1,"explain":"The policy states the Compliance Officer (Branch Manager) in each branch shall submit a Quarterly Compliance Certificate to the respective Regional Office in the prescribed format (Annexure-I) within 3 days from the close of the quarter."},{"q":"Within how many working days of observing a breach or non-compliance must a branch report it to the Regional Office?","options":["Three working days","One working day","Two working days","Seven working days"],"correct":2,"explain":"The policy states branches must report any breaches/non-compliances observed within two working days of observing the breach/non-compliance to the respective Regional Office."},{"q":"To which entity at the Sponsor Bank does the Chief Compliance Officer submit the Bank's monthly/quarterly compliance certificate?","options":["NABARD's DoS","The Legal Department of Sponsor Bank","CO: Rural Banking Department of Sponsor Bank","The Sponsor Bank's Chairman directly"],"correct":2,"explain":"The policy states the Bank shall submit monthly and/or quarterly compliance certificates duly signed by the CCO to CO: Rural Banking Department of the Sponsor Bank."},{"q":"What tool is being developed by the Compliance Department to track non-compliance by branches on a month-on-month basis?","options":["A Core Banking dashboard","An Offsite Monitoring tool","A Customer Feedback portal","A Risk Rating calculator"],"correct":1,"explain":"The policy states an Offsite Monitoring tool will be developed by the Compliance Department to track non-compliance by branches on a month-on-month basis, to improve data quality and integrity."},{"q":"The activities of the compliance function should be subject to what kind of review by Internal Audit?","options":["Annual Review","A one-time review at policy launch","A weekly review","A review only upon RBI's request"],"correct":0,"explain":"The policy states, under \"Annual Audit of Compliance Functions,\" that the activities of the compliance function should be subject to Annual Review by the Internal Audit."},{"q":"What does Circular No. 224/2025-26, dated 20-12-2025, pertain to?","options":["New and Revised Policies for FY 2026-27","Advisory on Information Sharing with LEAs/IAs","New and Revised Policies for FY 2025-26","Observance of Compliance Awareness Week from 22.12.2025 to 26.12.2025"],"correct":3,"explain":"Per the Circulars table, Circular 224/2025-26 dated 20-12-2025 relates to the Observance of Compliance Awareness Week from 22.12.2025 to 26.12.2025."},{"q":"Which circular carries the Advisory on Information Sharing with Law Enforcement Agencies/Intelligence Agencies?","options":["Circular 60/2026-27","Circular 44/2026-27","Circular 224/2025-26","Circular 24/2025-26"],"correct":0,"explain":"Per the Circulars table, Circular 60/2026-27 dated 06-06-2026 is the Advisory on Information Sharing with Law Enforcement Agencies/Intelligence Agencies (LEAs/IAs)."},{"q":"According to the Reporting Structure table, what does a Branch submit quarterly, which Regional Offices then collect and send to HO: Compliance Department?","options":["Loan Sanction Report","HR Appraisal Report","Business Growth Report","Compliance Report"],"correct":3,"explain":"The Reporting Structure table shows Branches submitting a quarterly Compliance Report, which Regional Offices collect and send to HO: Compliance Department."},{"q":"According to the Reporting Structure table, to which department does the Staff Training Centre (STC) submit its Compliance Certificate?","options":["HRM","HO: Compliance Department","Inspection and Audit Department","Regional Offices"],"correct":0,"explain":"The Reporting Structure table shows the STC reporting its Compliance Certificate to HRM."}]},{"topic":"SOP on Information Sharing with Law Enforcement & Intelligence Agencies","questions":[{"q":"The SOP on information sharing with Law Enforcement Agencies (LEAs) and Intelligence Agencies (IAs) was issued based on directions from which bodies?","options":["FEDAI and Ombudsman","Ministry of Home Affairs and IBA","Central Economic Intelligence Bureau (CEIB), and NABARD's instructions dated 21.05.2026","RBI and SEBI"],"correct":2,"explain":"The policy states the SOP was issued by the Central Economic Intelligence Bureau (CEIB), and NABARD's instructions vide letter dated 21.05.2026 directed the Bank to ensure adherence to it."},{"q":"When responding to government communication channels with gov.in or nic.in domains, the branch must act under intimation to whom?","options":["The respective Regional Office and HO Compliance Department","Only NABARD","Only the Sponsor Bank","Only the Chairman's secretariat"],"correct":0,"explain":"The policy states branches must respond to all government communication channels and broad level domains having gov.in or nic.in in the email address, under intimation to the respective Regional Office and HO Compliance Department."},{"q":"Within how many working days must a branch send an acknowledgement of availability of information/documents and the turnaround time (TAT) to the requesting agency?","options":["Three (03) working days","One working day","Seven working days","Two working days"],"correct":0,"explain":"The policy states the branch should send an acknowledgement regarding availability of information/documents and TAT to the agency concerned within three (03) working days, with a copy to the Regional Office and HO Compliance department."},{"q":"If an agency's request is for a debit freeze/stop/hold in a suspicious account, what must the branch do?","options":["Refer the matter to the Sponsor Bank first","Take immediate action","Wait for written confirmation before acting","Ignore the request until the quarterly RLCC meeting"],"correct":1,"explain":"The policy states that if the request of the agency is for debit freeze/stop/hold in suspicious accounts, branches are to take immediate action."},{"q":"If a Law Enforcement Agency's (LEA) request is made before 4 PM, by when must the branch intimate the acknowledgment of debit freeze/stop/hold and action taken?","options":["Within one working day","Within three working days","Within six weeks","The same day"],"correct":3,"explain":"The policy states the acknowledgment regarding debit freeze/stop/hold and action taken thereof must be intimated to the agency the same day, if the request is made by the LEA before 4 PM."},{"q":"For which type of request does the same-day (before 4 PM) acknowledgment timeline NOT apply, requiring fast-track handling instead?","options":["Requests from the Sponsor Bank","Requests routed through the National Cyber Crime Reporting Portal (NCRP)","Requests from the Income Tax Department","Requests from NABARD"],"correct":1,"explain":"The policy states this timeline would not be applicable for the requests routed through the National Cyber Crime Reporting Portal (NCRP), which need to be catered to on a fast-track basis."},{"q":"In all cases of data sharing with agencies, what counterparty details must banks invariably provide?","options":["Only the counterparty's name","Only the counterparty's mobile number","Only the counterparty's PAN number","Counterparty name, their account number, and IFSC of the Branch"],"correct":3,"explain":"The policy states that in all cases of data sharing with the agencies, the banks would invariably provide counterparty details in clear terms, including counterparty name, their account number, and IFSC of the Branch."},{"q":"As per the availability-of-information table, how many weeks does it take to make digital information such as Statement of Accounts or KYC \"available at other centres of the bank\"?","options":["6 weeks","3 weeks","2 weeks","1 week"],"correct":2,"explain":"The table states digital information such as Statement of Accounts, KYC, and Account Opening Forms is available at other centres of the bank within 2 weeks."},{"q":"If a branch receives verbal instructions from Cyber Police (phone/SMS/WhatsApp) for a lien/debit freeze due to urgency of action, within what time must these be followed up with an authorized letter/email?","options":["One (1) working day","Three (3) working days","One week","Same day"],"correct":0,"explain":"The policy states verbal instructions from Cyber police should be followed by an authorized letter/email of the appropriate authority within one (1) working day."},{"q":"For any information request scenario not specifically written in the SOP, what is the maximum time-limit to furnish the details?","options":["Three (3) months","Six (6) weeks","Three (3) working days","Two (2) weeks"],"correct":1,"explain":"The policy states that for anything not written in the SOP, the maximum time-limit would be six (6) weeks to furnish the details."}]}]},{"id":"inspection-audit","policyName":"Inspection & Audit Policies","quizzes":[{"topic":"Objectives, Hierarchy & Risk-Based Internal Audit (RBIA)","questions":[{"q":"Which body sits at the top of the audit hierarchy in the bank, above the Audit Committee of the Board and the Chairman?","options":["Board of Directors","Inspection and Audit Department","General Manager (Monitoring)","Audit Committee of Executives"],"correct":0,"explain":"The Hierarchy of Audit in Universe chart places the Board of Directors at the top, above the Audit Committee of the Board and the Chairman."},{"q":"As per the document, what is one stated purpose of inspections and audits conducted in banks?","options":["To evaluate the adequacy, completeness, operational effectiveness and efficiency of the control systems in the bank","To approve new product launches","To fix the annual budget of the branch","To conduct customer satisfaction surveys"],"correct":0,"explain":"The document lists evaluating the adequacy, completeness, operational effectiveness and efficiency of control systems as a key reason inspections and audits are conducted."},{"q":"Under Risk Based Internal Audit (RBIA), major risk areas taken up for risk assessment in branch activities include Credit, Earnings, Operations and which other area?","options":["Public Relations","Internal Control","Human Resources","Marketing"],"correct":1,"explain":"The document lists the four major risk areas for RBIA risk assessment as Credit, Earnings, Operations and Internal Control."},{"q":"Under RBIA, observations are classified under low, medium and high risk based on which set of loan accounts of the branch?","options":["Top 50 loan accounts","All jewel loan accounts","Top 100 loan accounts","Top 10 loan accounts"],"correct":2,"explain":"The RBIA table states observations are classified under low, medium and high risk based on the Top 100 loan accounts of the branch."},{"q":"As per the current year target mentioned in the document, what percentage of branches shall be covered under RBIA, with the rest covered under conventional inspection?","options":["60%","75%","100%","50%"],"correct":1,"explain":"The document states that in the current year 75% of the branches shall be covered under RBIA and the rest as per conventional inspection."},{"q":"Under conventional (regular) inspection, branches are rated using which five-tier scale based on percentage of marks scored?","options":["Red, Orange, Yellow, Blue, Green","Low, Medium, High, Very High, Extremely High","Fail, Weak, Average, Strong, Excellent","Poor, Unsatisfactory, Satisfactory, Good, Very Good"],"correct":3,"explain":"The comparison table shows conventional branch inspection rates branches as Poor, Unsatisfactory, Satisfactory, Good and Very Good based on % of marks scored."},{"q":"Under RBIA, a branch with 'High' Business Risk combined with 'Low' Control Risk is graded as which category?","options":["Very High Risk Branch","Medium Risk Branch","High Risk Branch","Extremely High Risk Branch"],"correct":2,"explain":"The RBIA grading table shows High Business Risk combined with Low Control Risk results in a 'High Risk Branch' grade."},{"q":"Under RBIA, a branch with 'High' Business Risk combined with 'High' Control Risk is graded as which category?","options":["Extremely High Risk Branch","High Risk Branch","Medium Risk Branch","Low Risk Branch"],"correct":0,"explain":"The RBIA grading table shows High Business Risk combined with High Control Risk results in an 'Extremely High Risk Branch' grade."},{"q":"In the Score/Rating of Control Level table, a score of 80% and above corresponds to which rating?","options":["Satisfactory","Good","Moderate","Very Good"],"correct":3,"explain":"The RBIA score table shows that a score of 80%+ corresponds to a 'Very Good' rating, indicating a sound and good control environment."},{"q":"Under Regular Inspection grading, a branch scoring 60% and above but below 70% is rated as?","options":["Unsatisfactory","Satisfactory","Good","Very Good"],"correct":1,"explain":"The Regular Inspection range-of-marks table shows 60% and above but below 70% corresponds to a 'Satisfactory' grade/rating."}]},{"topic":"Periodicity of Inspection & Offsite Monitoring","questions":[{"q":"Under RBIA/Regular Inspection periodicity, a Low Risk (Very Good rated) branch must be re-inspected within how many months of the previous inspection?","options":["9 months","18 months","12 months","15 months"],"correct":1,"explain":"The Periodicity of Inspection table shows Low Risk/Very Good branches have a previous-inspection period of 18 months."},{"q":"Under the periodicity of inspection table, a branch rated as 'Very High or Extremely High Risk' (or Unsatisfactory/Poor) must be re-inspected within how many months?","options":["15 months","9 months","18 months","12 months"],"correct":1,"explain":"The table shows Very High/Extremely High Risk or Unsatisfactory/Poor branches have the shortest inspection period of 9 months."},{"q":"For a newly opened branch, the first inspection findings should be reported to which committee, and within what period?","options":["ACE, on a quarterly basis","RACE, on a monthly basis","IAC, on a half-yearly basis","ACB, on an annual basis"],"correct":0,"explain":"The document states that for a newly opened branch, first inspection findings (period: 9 months) should be reported to ACE on a quarterly basis."},{"q":"The Offsite Monitoring Cell at Head Office monitors reports that may be reviewed on what frequency basis?","options":["Only on occurrence of fraud","Daily, weekly, monthly or quarterly basis","Only annually","Only half-yearly"],"correct":1,"explain":"The document states the frequency of these reports may be looked into on a daily, weekly, monthly or quarterly basis."},{"q":"What does the Offsite Monitoring Cell (OMU Cell) at Head Office primarily do?","options":["Issue solvency certificates","Conduct statutory audit of the bank","Approve annual budgets of branches","Monitor and guide the functioning of the Offsite Monitoring Unit (OMU) at Regional Offices"],"correct":3,"explain":"The document states the Offsite Monitoring Cell at Head Office shall monitor and guide the functioning of OMU at Regional Offices."},{"q":"In addition to key functional areas, what else does the OMU Cell monitor as prescribed by the Chairman/GM from time to time?","options":["Transactions exceeding threshold limit","Branch furniture inventory","Marketing campaigns","Staff leave records"],"correct":0,"explain":"The document states the OMU Cell shall monitor key functional areas and the transactions exceeding threshold limit prescribed by the Chairman/GM."},{"q":"A branch is classified as a 'Chronic Defaulter' if it has not submitted periodic audit returns to the Regional Office for how long?","options":["The past three months","The past one month","The past one year","The past six months"],"correct":0,"explain":"The General Guidelines slide defines a Chronic Defaulter as a branch which has not submitted periodic audit returns to Regional Office for the past three months."},{"q":"A Quick Mortality Account (QMA) is defined as an account that becomes NPA within what time period from the date of first disbursement, for limits sanctioned for the first time?","options":["18 months","Six months","One year","Two years"],"correct":2,"explain":"The document defines a QMA as any account becoming NPA within a period of one year from the date of first disbursement for first-time limits."},{"q":"If a branch reports two or more instances of QMAs with individual book balance of Rs.5.00 lakhs or more during a quarter, who takes this up with RACE to decide on verification of all loans sanctioned by that official?","options":["Chairman","Concurrent Auditor","Regional Manager","Branch Manager"],"correct":2,"explain":"The document states the Regional Manager shall take up with RACE to decide whether to verify all loans sanctioned by the official in such cases."},{"q":"For a branch categorized as Scale I or II in a rural/semi-urban centre, the follow-up of the Relieving Manager's Certificate for timely submission should occur within how many days from completion of taking charge?","options":["5 days","7 days","3 days","4 days"],"correct":3,"explain":"The document specifies that for Scale I & II branches in rural/semi-urban centres, the follow-up period is 4 days from date of completion of taking charge."}]},{"topic":"Audit Committees: ACB, ACE & RACE","questions":[{"q":"The Audit Committee of Board (ACB) guides in developing effective policies for which functions?","options":["Only Internal Audit","Only Concurrent Audit and IS Audit","Internal Audit, Concurrent Audit, IS Audit and all other inspection and audit functions","Marketing and HR functions"],"correct":2,"explain":"The document states the ACB will guide in developing effective Internal Audit (Chairman), Concurrent Audit, IS Audit and all other inspection & audit functions."},{"q":"Which of the following is an item reviewed ANNUALLY by the Audit Committee of the Board (ACB), rather than quarterly?","options":["Annual review of Whistle Blower Policy","Review note on frauds","Quarterly review of Concurrent Audit Reports","Review of minutes of ACE"],"correct":0,"explain":"The ACB table lists Annual review of Whistle Blower Policy under the 'Annual' column, while the other options are listed under 'Quarterly'."},{"q":"The ACB reviews the status of legal audits conducted for accounts with what minimum exposure, on a quarterly basis?","options":["Rs.10 lakhs and above","Rs.50 lakhs and above","Rs.1.00 Crore and above","Rs.5.00 Crore and above"],"correct":2,"explain":"The document states ACB quarterly reviews the status of Legal Audits conducted for accounts with exposure of Rs.1.00 Crore and above."},{"q":"How frequently must the Audit Committee of Executives (ACE) meet, as a minimum requirement?","options":["At least once in a quarter and minimum 6 times a year","At least once a month","At least twice a year","At least once a year"],"correct":0,"explain":"The document states ACE should meet minimum at least once in a quarter and minimum of 6 times in a year."},{"q":"Who serves as the Convenor of the Audit Committee of Executives (ACE)?","options":["HOD (Inspection & Audit)","HOD (Credit)","General Manager (Monitoring)","HOD (Vigilance)"],"correct":0,"explain":"The document explicitly states that HOD (Inspection & Audit) will be the Convenor of ACE."},{"q":"What is ACE authorized and empowered to approve or ratify, besides other functions?","options":["Recruitment of new branch managers","Sanction of all staff loans","Annual bank budget","Changes/amendment in the scoring pattern, rating parameters and reporting formats"],"correct":3,"explain":"The document states ACE is authorized and empowered to approve/ratify changes/amendment in the scoring pattern, rating parameters and reporting formats."},{"q":"In the ACE half-yearly review items, which department (HO) is responsible for 'Review on the recovery of amount involved in fraud'?","options":["Credit","Inspection & Audit","Vigilance","Recovery"],"correct":1,"explain":"The half-yearly review table lists 'Review on recovery of amount involved in fraud' under HO: Inspection & Audit."},{"q":"At Regional Audit Committee of Executives (RACE) meetings, whose presence (without delegation) is compulsory?","options":["General Manager","Branch Manager","Chairman","Regional Manager"],"correct":3,"explain":"The document explicitly states Regional Manager (without delegation) is compulsory in RACE meetings."},{"q":"Who chairs the RACE meetings held at Regional Offices?","options":["The General Manager (Monitoring)","The IC Head","The Regional Manager","The Chairman of the Bank"],"correct":1,"explain":"The document states RACE meetings held at Regional Offices shall be chaired by the IC Head."},{"q":"As per RACE guidelines, what is the maximum number of RACE meetings held in a month, and which branch category is closed at HO instead of RACE?","options":["Maximum three meetings a month; Category 'B' branches closed at HO","Maximum two meetings a month; Category 'E' branches closed at HO","Maximum one meeting a month; Category 'A' branches closed at HO","Maximum four meetings a month; Category 'C' branches closed at HO"],"correct":1,"explain":"The document states monthly maximum is two RACE meetings, and branches Category 'E' shall be closed at HO."}]},{"topic":"Inspection Centres, HO Department Roles & Zero Tolerance Areas","questions":[{"q":"Which officer grade is designated as In-Charge (MAP) for Inspection Centres?","options":["Senior Manager / Manager in Regional Office","Assistant General Manager","Chief Manager","Scale I Officer"],"correct":0,"explain":"The document states one officer in the grade of Senior Manager / Manager in Regional Office will be designated as In-Charge (MAP)."},{"q":"Inspection of Training Centres by Inspection Centres is conducted on what basis?","options":["Monthly","Quarterly","Bi-annual","Annual"],"correct":2,"explain":"The document states Inspection Centres conduct inspection of Training Centres on a bi-annual basis."},{"q":"The Regional Manager must visit a branch within how many months from the date it is declared High/Very High/Extremely High risk (or Satisfactory/Unsatisfactory/Poorly rated)?","options":["6 months","1 month","3 months","9 months"],"correct":2,"explain":"The document states the Regional Manager is to visit the branch within 3 months from the date of declaring the branch under the above risk/rating categories."},{"q":"A 'spurt in advances' flagged for scrutiny is defined as an increase of more than what percentage by number/amount over the previous quarter?","options":["20%","5%","15%","10%"],"correct":3,"explain":"The document defines Spurt in Advances as advances of more than 10% by number/amount over the previous quarter."},{"q":"Which HO department is responsible for co-ordinating the concurrent audit of branches and organizing the empanelment of external auditors?","options":["HO: Credit Department","HO: Inspection & Audit Department","HO: Vigilance Department","HO: Compliance Department"],"correct":1,"explain":"The document lists co-ordinating concurrent audit and empanelment of external auditors as functions of the HO: Inspection & Audit Department."},{"q":"Which of the following is listed as a 'Zero Tolerance Area' that must be compulsorily complied with before closure of an inspection report or accepting FRC?","options":["Non-display of interest rate charts","Non creation/non registration of mortgage deed (lien on deposits, assignments) or MOD for securities in favour of the bank","Minor discrepancy in stationery stock register","Delay in staff training completion"],"correct":1,"explain":"The document lists non-creation/non-registration of mortgage deed or MOD as a Zero Tolerance Area requiring compulsory compliance."},{"q":"According to the Zero Tolerance Areas section, a branch with any zero tolerance deficiency must be rated as high risk and rectified within how many days?","options":["30 days","15 days","7 days","60 days"],"correct":1,"explain":"The document states that irrespective of marks obtained, branches with zero tolerance area issues should be rated as high risk, with rectification within 15 days."},{"q":"A fresh slippage of time-barred DPNs is treated as a Zero Tolerance Area issue if the number exceeds 10 or the amount involved exceeds what value?","options":["Rs.5.00 lakhs","Rs.1.00 lakh","Rs.10.00 lakhs","Rs.2.00 lakhs"],"correct":0,"explain":"The document specifies fresh slippage of time-barred DPNs is a zero tolerance issue if more than 10 in number or amount involved is more than Rs.5.00 lakhs."},{"q":"As per the Selection of Staff for Audit System guidelines, for how long should an officer preferably have served as Branch Manager before being considered as an inspector?","options":["Minimum period of 5 years","Minimum period of 1 year","Minimum period of 6 months","Minimum period of 2 years"],"correct":3,"explain":"The document states the officer should preferably be Scale II and above and have served as Branch Manager for a minimum period of 2 years."},{"q":"Under the SOP for inspectors, within how many working days must inspectors submit their reports?","options":["3 working days","2 working days","5 working days","7 working days"],"correct":0,"explain":"The document states inspectors submit the reports within 3 working days as part of the SOP."}]},{"topic":"Revenue Audit, Snap Audit & Special Reports","questions":[{"q":"Branches with total advances of Rs.1.00 Crore and above (excluding jewel loans and loan on deposits) are subjected to Revenue Audit on what basis?","options":["Monthly basis","Half yearly basis","Annual basis","Quarterly basis"],"correct":1,"explain":"The document states all branches with total advances of Rs.1.00 Crore and above are subjected to revenue audit on a half yearly basis."},{"q":"Revenue Audit must be completed within what timeframe of the closure of the half year?","options":["Two months","Three months","Fifteen days","A month"],"correct":3,"explain":"The document states Revenue Audit shall be completed within a month of the closure of the half year."},{"q":"Cent percent transaction audit is required where an expenditure head shows an increase of more than what percentage over the previous year?","options":["20%","10%","30%","15%"],"correct":0,"explain":"The document states cent percent transaction audit is to be done where the expenditure head shows an increase of more than 20% over the previous year."},{"q":"Top how many branches (business-wise) as on previous March/September will be subjected to Revenue Audit by Inspection Centres?","options":["50 branches","200 branches","100 branches","150 branches"],"correct":2,"explain":"The document states the top 100 branches business-wise as on previous March/September will be subjected to Revenue Audit by Inspection Centres."},{"q":"What is the maximum permissible duration for a Snap Audit of a branch?","options":["2 days","5 days","7 days","1 day"],"correct":0,"explain":"The document explicitly states Snap Audit may not exceed 2 days."},{"q":"Special Reports submitted by inspectors are addressed to whom, under copy to the IC Head?","options":["Chairman of the bank","HOD Vigilance","Regional Manager","General Manager (in-charge of Inspection & Audit Department)"],"correct":3,"explain":"The document states inspectors are required to submit Special Reports to the General Manager (in-charge of Inspection & Audit Department) under copy to the IC Head."},{"q":"Special Reports have to be closed within what timeframe from the date of the report?","options":["15 days","3 months","2 months","1 month"],"correct":2,"explain":"The document states special reports have to be closed within 2 months from the date of the report."},{"q":"For excess cash found in the Sundry Deposit A/c, amounts less than Rs.100 should be handled how?","options":["Written off directly","Credited to customer account after investigation","Transferred to income account immediately","Reported to RBI"],"correct":1,"explain":"The document states amounts less than Rs.100 are credited to customer's account after investigation, whereas amounts more than Rs.100 go through RO and are unclaimed for up to 1 year before transfer to income account with permission."},{"q":"Which of the following is listed as a 'Special Report' trigger under the document?","options":["Advances granted by the Branch Manager to close relatives or self without prior HO approval","Branch running out of currency notes","Staff requesting festival advance","Delayed submission of monthly stationery report"],"correct":0,"explain":"The document lists advances granted by the Branch Manager to close relatives or self without prior approval of Head Office as a Special Report trigger."},{"q":"A branch is treated as 'Very High Risk' or 'Unsatisfactory' due to fraud occurrence if more than how many instances of fraud are reported during a financial year, or if the aggregate fraud amount exceeds a certain value?","options":["More than five instances, or aggregate amount more than Rs.5.00 lakhs","More than three instances, or aggregate amount more than Rs.10.00 lakhs","More than one instance, or aggregate amount more than Rs.1.00 lakh","More than two instances, or aggregate amount more than Rs.20.00 lakhs"],"correct":1,"explain":"The document states more than three instances of frauds in a financial year, or aggregate fraud amount more than Rs.10.00 lakhs, results in Very High Risk or Unsatisfactory rating."}]},{"topic":"Closure of Audit Cycle, Management Audit & Credit/Stock Audit","questions":[{"q":"The first compliance/rectification reply to an audit report must be submitted within what timeframe from receipt of the audit report?","options":["One month","Three months","Two months","15 days"],"correct":0,"explain":"The document states the first compliance/rectification reply is within one month from the receipt of the audit report, under 'Closure of Audit Cycle'."},{"q":"The Final Rectification Certificate (FRC) must be submitted within what timeframe?","options":["45 days","One month","Two months","Three months"],"correct":2,"explain":"The document states the Final Rectification Certificate (FRC) shall be submitted within two months, under 'Closure of Audit Cycle'."},{"q":"Closure of Credit Audit reports at RO (RACE) level must be completed within how many days?","options":["60 days","30 days","90 days","45 days"],"correct":0,"explain":"The document states closure of Credit Audit reports at RO: RACE is within 60 days, and Credit and Inspection are also noted as closed within 60 days."},{"q":"For Management Audit of a Regional Office, what is the man-days requirement and who conducts it?","options":["3 days, by an external CA firm","2 days, by a Senior Manager from other RO/HO along with IC Head","1 day, by the Regional Manager alone","5 days, by the Chairman"],"correct":1,"explain":"The Management Audit table specifies a Senior Manager from other RO/HO along with IC Head conducts it annually, requiring 2 days."},{"q":"Who closes the Management Audit report of Regional Offices, after which HO: Inspection & Audit places a consolidated review note to ACE and ACB?","options":["The IC Head","The Chairman","The Regional Manager","The General Manager (Monitoring)"],"correct":1,"explain":"The document states Management Audit report of Regional Offices will be closed by the Chairman, with a consolidated review note placed before ACE and ACB."},{"q":"External frauds such as pledge of stolen jewels up to what amount need not result in downgrading of the RBIA rating?","options":["Rs.20.00 lakhs","Rs.5.00 lakhs","Rs.1.00 lakh","Rs.10.00 lakhs"],"correct":3,"explain":"The document states external frauds like pledge of stolen jewels up to Rs.10.00 lakhs need not result in downgrading of the RBIA rating."},{"q":"For Credit Audit, closure of reports is placed to the Chairman by which HO department, in coordination with the IA department?","options":["HO: Recovery HOD","HO: Credit HOD","HO: Compliance HOD","HO: Vigilance HOD"],"correct":1,"explain":"The document states closure of Credit Audit reports: HO: Credit HOD, IA Department, placed to Chairman, and RO: RACE within 60 days."},{"q":"Besides Statutory Audit by external auditors, the bank is subject to inspection by NABARD on what frequency, and Management Audit by the Sponsor Bank on what frequency?","options":["NABARD annually; Sponsor Bank once in two years","Both annually","NABARD quarterly; Sponsor Bank annually","NABARD once in two years; Sponsor Bank annually"],"correct":0,"explain":"The document states the bank is subject to Inspection by NABARD annually and Management Audit by the Sponsor Bank once in two years."},{"q":"Which types of audit are named directly under 'Types of Audits' in the document, alongside Revenue Audit and Credit Audit?","options":["Only Revenue and Credit Audit","Payroll Audit and Vendor Audit","Staff Accountability Study, IS Audit, Compliance Audit, Jewel Verification, Snap/Special Audit, Pre-Release Audit, Stock Audit","Marketing Audit, HR Audit, Legal Audit"],"correct":2,"explain":"The 'Types of Audits' slide lists Revenue Audit, Staff Accountability Study, IS Audit, Compliance Audit, Jewel Verification, Snap/Special Audit, Pre Release Audit, Credit Audit and Stock Audit."},{"q":"Compliance Audit is conducted at what point in the audit cycle?","options":["Only during snap audit","Only for branches rated Poor","Before the inspection begins","After receipt of FRC, before acceptance for closure of report"],"correct":3,"explain":"The document states Compliance Audit occurs after receipt of FRC (before acceptance for closure of report)."}]},{"topic":"Information Systems (IS) Audit Policy","questions":[{"q":"Software Audit is generally carried out utilising the services of officers holding which qualification?","options":["CFA qualified officers","CISA qualified officers","CA qualified officers","CAIIB qualified officers"],"correct":1,"explain":"The document states Software Audit shall be carried out generally utilising the services of CISA qualified officers of the bank."},{"q":"Application software audit under IS Audit is carried out by which type of empaneled auditors?","options":["CERT-In empaneled auditors","RBI empaneled auditors","SEBI empaneled auditors","NABARD empaneled auditors"],"correct":0,"explain":"The document states application software audit is carried out by CERT-In empaneled auditors (Computer Emergency Response Team)."},{"q":"Network Audit under IS Audit is conducted on what frequency, using CISA/CISSP qualified officers?","options":["Quarterly basis","Bi-annual basis","Half-yearly basis","Annual basis"],"correct":3,"explain":"The document states Network Audit is conducted on an annual basis using CISA/CISSP qualified officers attached to the core team of IS Audit."},{"q":"Under the IS Audit rating and reporting scale, a score below 50% is rated as which risk category?","options":["Low Risk","Extremely High Risk","Medium Risk","High Risk"],"correct":3,"explain":"The document states for IS Audit rating, a score below 50% is rated High Risk, 50-70% Medium Risk, and above 70% Low Risk."},{"q":"Other IS Audit coverage such as aggregation points (routers & switches), AEPS/POS, ATM, third-party IT environments and Data Centre is conducted on what frequency?","options":["Annual (Administrative Departments bi-annual)","Only once at go-live","Monthly","Weekly"],"correct":0,"explain":"The document states IS Audit of aggregation points, ATM, third-party IT environments, Data Centre, CBS Project Office, DR site, CTS Centre, Regional Offices is annual, while Administrative Departments are bi-annual."},{"q":"VAPT (audit) of critical applications like Internet Banking and Mobile Banking should be conducted at what minimum frequency?","options":["At least half yearly","At least quarterly","At least annually","At least monthly"],"correct":0,"explain":"The document states VAPT of critical applications - Internet Banking, Mobile Banking - is to be audited at least half yearly."},{"q":"Which of these is listed as a Special Report item under IS Audit?","options":["Incomplete loan documentation","Lack of awareness in maintaining password secrecy","Delay in ATM cash replenishment","Poor branch network connectivity speed"],"correct":1,"explain":"The document lists lack of awareness in maintaining password secrecy as one of the IS Audit Special Reports items."},{"q":"Maintenance of which type of account in a branch, other than those permitted by the system, is flagged as an IS Audit special report item?","options":["Sundry deposit account","Nominal account","Parking account","Suspense account"],"correct":2,"explain":"The document lists maintenance of parking account in branch, other than those permitted by the system, as an IS Audit special report concern."},{"q":"Branch Audit under IS Audit types corresponds to what activity?","options":["External statutory audit","Only network audit","Regular inspection","Only VAPT testing"],"correct":2,"explain":"The document states under 'Various Types of Information Systems Audit', Branch Audit corresponds to Regular Inspection."},{"q":"Which of the following is listed as an IS Audit special report concern regarding daily checks?","options":["Delay in monthly stationery indent","Non-checking of VVR, SWO & other critical reports on a daily basis","Failure to update branch signage","Non-attendance of staff training"],"correct":1,"explain":"The document lists non-checking of VVR, SWO and other critical reports on a daily basis as an IS Audit special report item."}]},{"topic":"Staff Accountability Policy","questions":[{"q":"Staff accountability for lapses in an advance account must be examined within how many years of the relief of the officer concerned?","options":["5 years","3 years","2 years","4 years"],"correct":3,"explain":"The document states staff accountability for lapses in advance account is to be examined within 4 years of the relief of the officer."},{"q":"Staff accountability examination should be completed at least how long before the retirement of the staff member?","options":["1 year before retirement","6 months before retirement","3 months before retirement","1 month before retirement"],"correct":2,"explain":"The document states staff accountability at least 3 months before the retirement of the staff should be examined."},{"q":"For which category of large value NPA accounts must a copy of the staff accountability study report be forwarded to the CVO and the Sponsor Bank?","options":["Accounts with book balance of Rs.1 Crore and above","Accounts with book balance of Rs.50 lakhs and above","All NPA accounts regardless of value","Accounts with book balance of Rs.5 Crore and above"],"correct":0,"explain":"The document states all large value NPA accounts with book balance of Rs.1 Crore and above where staff accountability study is conducted require a copy sent to CVO and the Sponsor Bank."},{"q":"Which committee is convened by HOD Vigilance Department and consists of heads of Recovery, Accounts, Credit and Planning departments, for staff accountability?","options":["Audit Committee of Executives (ACE)","Regional Staff Accountability Committee (RSAC)","Regional Audit Committee of Executives (RACE)","Internal Advisory Committee (IAC)"],"correct":3,"explain":"The document states the Internal Advisory Committee (IAC) consists of heads of Recovery, Accounts, Credit and Planning departments, with HOD Vigilance as convenor."},{"q":"For non-credit related staff accountability issues involving exposure up to Rs.1.00 lakh, which authority handles the report?","options":["Chairman level HO Staff Accountability Committee","GM level HO Staff Accountability Committee","Regional Staff Accountability Committee (RSAC) headed by RM","RACE headed by IC-Head"],"correct":2,"explain":"The competent authority table shows exposure up to Rs.1 lakh is handled by the Regional Staff Accountability Committee (RSAC) headed by RM."},{"q":"For non-credit related issues with amount involved above Rs.15.00 lakhs, which authority is the competent authority for staff accountability reports?","options":["Chairman level HO Staff Accountability Committee","Regional Staff Accountability Committee (RSAC)","GM level HO Staff Accountability Committee","RACE headed by IC-Head"],"correct":0,"explain":"The competent authority table shows amounts above Rs.15.00 lakhs are handled by the Chairman level HO Staff Accountability Committee."},{"q":"Which of the following is listed as one of the triggering credit-area events for staff accountability study?","options":["Branch relocating premises","Account slipping to NPA category","Branch receiving an award","Staff attending training program"],"correct":1,"explain":"The document lists account slipping to NPA category as one of the trigger events (along with filing of suit, OTS, adverse audit findings) for staff accountability study."},{"q":"Which of these is listed among the 'Non-Credit Areas' warranting staff accountability study?","options":["Non-compliance to KYC/AML/CFT guidelines","Late opening of branch","Delay in ATM replenishment","Poor customer service ratings"],"correct":0,"explain":"The document lists non-compliance to KYC/AML/CFT guidelines as a non-credit area item warranting staff accountability study."},{"q":"The staff accountability study for advance accounts is based on outstanding balance excluding which component?","options":["Principal amount","MOI (Memorandum of Interest)","Sanctioned limit","Security value"],"correct":1,"explain":"The document states the staff accountability study is based on the outstanding balance excluding MOI."},{"q":"If a staff accountability lapse is identified in a study report but not reported in the inspection reports, who is held responsible?","options":["The Regional Manager alone","The respective inspecting official/s","The Branch Manager alone","The Chairman"],"correct":1,"explain":"The document states that if the staff accountability study report was not reported in inspection reports, the respective inspecting official/s would be held responsible."}]},{"topic":"Concurrent Audit Policy","questions":[{"q":"Concurrent Audit coverage must ensure at least what percentage of deposits and advances of the bank on an ongoing basis?","options":["50% of deposits and 50% of advances","75% of deposits and 75% of advances","100% of deposits and 50% of advances","25% of deposits and 25% of advances"],"correct":0,"explain":"The document states coverage of at least 50% of deposits and 50% of advances and other risk exposure of the bank under concurrent audit is to be ensured on an ongoing basis."},{"q":"Branches with average advance figure of less than what amount may be exempted from concurrent audit coverage?","options":["Less than Rs.5.00 Crore","Less than Rs.25.00 Crore","Less than Rs.1.00 Crore","Less than Rs.10.00 Crore"],"correct":3,"explain":"The document states branches with average advance figure of less than Rs.10.00 Crore may be exempted from concurrent audit coverage."},{"q":"Concurrent Audits are conducted by which external parties?","options":["Only in-house bank staff","Only RBI-appointed auditors","Only NABARD officials","Chartered Accountants / retired bank officials"],"correct":3,"explain":"The document states concurrent audits are conducted by external Chartered Accountants / retired bank officials."},{"q":"Under concurrent audit, the report of the month is due by when, and closure of reports is expected within what period?","options":["End of succeeding month; closure within 1 month","15th of succeeding month; closure within 3 months","5th of succeeding month; closure within 2 months","10th of succeeding month; closure within 1 month"],"correct":2,"explain":"The document states the report of the month is due before the 5th of the succeeding month, with closure of reports within 2 months."},{"q":"The tenure of a Concurrent Auditor is initially for how long, extendable for a further period, subject to satisfactory performance?","options":["Three years, non-extendable","One year, extendable for a further two years (overall three years)","Six months, extendable for six months","Two years, extendable for a further one year"],"correct":1,"explain":"The document states the tenure of concurrent audit would be initially for one year and would be extended for a further period of two years (overall three years), based on performance."},{"q":"Retired officers considered for initial engagement as concurrent auditors must have retired on superannuation within the last how many years, in Scale II and above?","options":["Last five years","Last three years","Last two years","Last one year"],"correct":1,"explain":"The document states officers who retired on superannuation in Scale II & above within the last three years may be considered for initial engagement as concurrent auditor."},{"q":"What is the maximum permissible age for a retired officer to continue as concurrent auditor, including being assigned another branch from the 4th year onwards?","options":["62 years","65 years","60 years","70 years"],"correct":1,"explain":"The document states the retired officer can be assigned another branch in the 4th year onwards within the maximum permissible age of 65 years."},{"q":"As part of Concurrent Auditor's role, how many jewel packets should be randomly verified every month?","options":["10 jewel packets","50 jewel packets","20 jewel packets","5 jewel packets"],"correct":2,"explain":"The document states random verification of 20 number of jewel packets every month is part of the Concurrent Auditor's role."},{"q":"As per fees structure, what is the concurrent audit fee for a branch with total business between Rs.50 crore and up to Rs.100 crore?","options":["Rs.9000","Rs.8000","Rs.10000","Rs.7000"],"correct":0,"explain":"The Concurrent Audit fee table shows Rs.9000 for total business above Rs.50 crore and up to Rs.100 crore."},{"q":"Stock Audit / Credit Audit of a branch shall NOT be allotted to which auditor for that same branch?","options":["The Concurrent Auditor of the same branch","The IS Auditor of the branch","Any retired bank official","Any external Chartered Accountant firm"],"correct":0,"explain":"The document states Stock Audit/Credit Audit shall not be allotted to the Concurrent Auditor of the same branch, to maintain independence."}]}]},{"id":"inspection-circulars-2026","policyName":"Inspection Circulars 2026","quizzes":[{"topic":"Long Pending Entries and Parking Account - Reversal Timelines and Limits","questions":[{"q":"Which circular number and date govern 'Long Pending Entries and Parking Account'?","options":["170/2024-25 dated 28.02.2024","14/2025-26 dated 05.04.2025","170/2023-24 dated 28.02.2024","103-2024-25 dated 27.08.2024"],"correct":2,"explain":"The slide heading states 'Long Pending Entries and Parking Account (Circular 170/2023-24 dated 28.02.2024)'."},{"q":"Under the Sundry Receivable Deposit (SR-I) head, which entries are permitted?","options":["Vigilance related entries only","Premises Rent Advance and Caution Deposits for TNEB, BSNL etc.","Excess cash entries only","Any entry approved by the RO"],"correct":1,"explain":"The circular states 'Entries other than Premises Rent Advance, Caution Deposits for TNEB, BSNL etc., should not be allowed in SR-I head', meaning only these are permitted."},{"q":"As per the circular, entries under Sundry Receivable II (other than those permitted by Head Office) should not be allowed to remain outstanding for more than how many days from the date of entry?","options":["30 days","15 days","60 days","45 days"],"correct":0,"explain":"The circular states such SR-II entries 'should not be allowed to be outstanding for more than 30 days from the date of entry'."},{"q":"Expenditure related entries under BM discretionary powers should be reversed within what period?","options":["15 days","Two months","One month","One week"],"correct":2,"explain":"The circular states 'Expenditure related entries under BM discretionary should be reversed within one month'."},{"q":"A confirmation proposal for entries exceeding BM discretion should be sent to the RO within how many working days from the end of the month?","options":["6 working days","3 working days","10 working days","2 working days"],"correct":1,"explain":"The circular states 'Exceeding BM discretion confirmation proposal should be sent to Ro with in 3 working days from the end of the month'."},{"q":"After receiving the proposal for entries exceeding BM discretion, within how many working days from the month end should the RO process it?","options":["30 days","3 working days","10 working days","6 working days"],"correct":3,"explain":"The circular states 'RO should be process the same with in 6 working days from the month end'."},{"q":"Entries sanctioned under Head Office (HO) discretion should be vouched for reversal within how many working days from the month end?","options":["10 working days","3 working days","60 days","6 working days"],"correct":0,"explain":"The circular states 'All entries sanctioned under HO discretion should be vouched for reversal with in 10 working days from the month end'."},{"q":"What action does the circular state should be taken if confirmation is not received for entries sanctioned under HO discretion?","options":["The branch is closed for the day","The entry is automatically written off","No action is required","Recovery is made from the staff concerned"],"correct":3,"explain":"The circular states 'If not get confirmation, recovery made from the staff concerned'."},{"q":"Under the OSL category described in the circular, entries should be reversed within how many days from the date of entry?","options":["60 days","45 days","30 days","90 days"],"correct":0,"explain":"The circular states 'All the entries should be reversed with in 60 days from the date of entry' under OSL."},{"q":"According to the circular, how do the reversal timelines for C2C and FIT entries compare?","options":["Both must be reversed within 2 working days","C2C within 2 working days, FIT within the next working day","C2C within the next working day, FIT within 2 working days","Both must be reversed within the next working day"],"correct":1,"explain":"The circular states C2C entries should be reversed 'with in 2 working days from the date of entry' while FIT entries should be reversed 'with in Next working day fro the date of entry'."}]},{"topic":"Time-Barred DPNs and Cyber Crime Awareness Circulars","questions":[{"q":"As per Circular No. 103-2024-25 on Time Barred DPNs, within what limitation period must an acknowledgment of indebtedness be obtained to preserve the bank's right to initiate legal action?","options":["Two years","One year","Three years","Five years"],"correct":2,"explain":"The circular states the acknowledgment must be obtained 'within the limitation period (three years) from the date of DPN or the date of the previous Acknowledgement of Debt Cum Security'."},{"q":"The three-year limitation period for obtaining an acknowledgment of indebtedness is counted from the date of the DPN or from which other date?","options":["The date of the previous Acknowledgement of Debt Cum Security (AOD-D11)","The date the loan was sanctioned","The date of the last branch inspection","The date of account opening"],"correct":0,"explain":"The circular specifies the limitation period runs 'from the date of DPN or the date of the previous Acknowledgement of Debt Cum Security (AOD-D11)'."},{"q":"What does AOD-D11 refer to in Circular No. 103-2024-25 (Time Barred DPNs)?","options":["Account Opening Document","Audit Observation Discrepancy","Annual Overdue Declaration","Acknowledgement of Debt Cum Security"],"correct":3,"explain":"The circular explicitly names 'Acknowledgement of Debt Cum Security (AOD-D11)' as one of the acknowledgment documents."},{"q":"In the case of a deceased borrower, from whom should the Letter of Acknowledgement of Debt (AOL-D11A) be obtained as per Circular No. 103-2024-25?","options":["The legal heir of the deceased","The Regional Office","The guarantor only","The branch manager"],"correct":0,"explain":"The circular states the 'Letter of acknowledgement of debt to be obtained from the legal heir of the deceased (AOL-D11A)'."},{"q":"Circular No. 103-2024-25 dealing with Time Barred DPNs is dated:","options":["27.08.2024","27.08.2025","28.02.2024","05.04.2025"],"correct":0,"explain":"The slide heading states 'Time Barred DPNs (Cir. No:103-2024-25 dated 27.08.2024)'."},{"q":"According to Circular No.14/2025-26 on cyber crime, what does 'Phishing Attacks' refer to?","options":["Using corrupt mobile charging stations","Sending fraudulent emails or messages","Infecting devices via malware","Advertising unrealistic investment returns"],"correct":1,"explain":"The circular defines Phishing Attacks as: 'Send fraudulent emails or messages'."},{"q":"Which cyber-crime method described in Circular No.14/2025-26 involves using stolen or leaked personal data to gain unauthorized access to bank accounts?","options":["Phishing Attacks","Taking Control of Account","Malware and Ransomware","Online Sales fraud"],"correct":1,"explain":"The circular describes 'Taking Control of Account' as: 'Stolen or leaked personal data to gain unauthorized access to bank accounts'."},{"q":"Circular No.14/2025-26 describes a cyber fraud tactic involving advertisements of high-return investments and unrealistic discounts on products online. Under which category is this listed?","options":["Charging Points","Phishing Attacks","Taking Control of Account","Online Sales"],"correct":3,"explain":"The circular lists 'Online Sales: Advertisement on high return investment and unrealistic discount on online sales of products.'"},{"q":"Which cyber-crime risk in Circular No.14/2025-26 relates to corrupt mobile charging stations that use the same cable for charging and data transfer?","options":["Malware and Ransomware","Online Sales","Charging Points","Phishing Attacks"],"correct":2,"explain":"The circular describes 'Charging Points: Use corrupt mobile charging station to infect phone and tablet same cable for charging and data transfer.'"},{"q":"Which of the following is listed as a precaution to protect customers under Circular No.14/2025-26?","options":["Share confidential information only with known social media contacts","Avoid using public unknown charging portals","Connect to public Wi-Fi for convenience when banking","Use the same password across all accounts for easy recall"],"correct":1,"explain":"The precautions list explicitly states 'Avoid using public unknown charging portal' and separately 'Don't connect public Wi-Fi', making the other options contrary to the guidance."}]}]},{"id":"types-of-customer","policyName":"Types of Customer 2026","quizzes":[{"topic":"Banking & Customer Fundamentals","questions":[{"q":"As per Section 5(b) of the Banking Regulation Act, 1949, deposits accepted for lending or investment are repayable on demand or otherwise, and withdrawal is made by which means?","options":["Cheque, draft, order or otherwise","Only by cheque","Only through an ATM","Only through a bank draft"],"correct":0,"explain":"Section 5(b) of the Banking Regulation Act, 1949 defines banking as accepting deposits repayable on demand or otherwise, and withdrawal by cheque, draft, order or otherwise."},{"q":"According to John Paget's definition, what constitutes a person as a 'Customer' of a bank?","options":["A person who has taken a loan from the bank","A person who has deposited money only once","A person who has an account with the bank, whether fixed or savings, and has dealing of a banking nature","Any person who enters a bank branch for enquiry"],"correct":2,"explain":"John Paget defined a Customer as 'a person who has an account with a bank, whether fixed or savings, and has dealing of banking nature.'"},{"q":"John Paget's definition of Customer, based on transactions of deposit and withdrawal of money at frequent intervals, is popularly known as what?","options":["The Frequency Rule","The Duration Theory","The Contract Theory","The Deposit Theory"],"correct":1,"explain":"The document states this definition of Customer 'is popularly known as the Duration Theory.'"},{"q":"The banking relationship between a bank and its customer is established as a contract governed by which Act?","options":["Banking Regulation Act, 1949","Companies Act, 2013","Indian Trust Act, 1882","Indian Contract Act, 1872"],"correct":3,"explain":"The slide states that banking relationship is a contract between the Bank and the Customer, and refers to the Indian Contract Act, 1872 for establishing the relationship."},{"q":"As per the Indian Contract Act 1872, which of the following persons is NOT legally competent to enter into a contract with a bank?","options":["A major person of sound mind","A drunken person who is not in good sense","A person not disqualified by any law","A person who is not insolvent"],"correct":1,"explain":"The material states that a drunken person is not legally competent to enter into a contract, and one should be in good sense while opening an account."},{"q":"As per the Indian Contract Act 1872, at what age does an individual become 'major' and legally competent to enter into a valid contract?","options":["18 years","21 years","16 years","15 years"],"correct":0,"explain":"The individual should be major, i.e. of 18 years of age, to be competent to enter into a valid contract."},{"q":"Besides proof of identity, residential address and photographs, what else must a person furnish while opening a deposit account?","options":["A guarantor's signature","A police verification certificate","An income certificate","Initial deposit not less than the prescribed minimum"],"correct":3,"explain":"The prescribed account opening form requires proof of identity and address, photographs, and an initial deposit not less than the prescribed minimum."},{"q":"As per RBI's guidance mentioned in the training material, what is NOT necessary for opening a new bank account?","options":["Proof of residential address","Proof of identity","Introduction by an existing account holder","Photographs"],"correct":2,"explain":"RBI has informed that introduction is not necessary for opening of accounts, so banks should not insist on introduction of an existing customer while opening a new account."},{"q":"Which of the following is listed under the 'Personal accounts' category of customer types in the training material?","options":["Hindu Undivided Family","Minor Account","Trust","Partnership Firm"],"correct":1,"explain":"Under 'Personal accounts' the material lists Single Individual, Joint Individual, Minor Account, Illiterate Person, Blind Person, and Pardanashin women."},{"q":"What is the stated purpose of accepting deposits of money from the public, as per the definition of banking under Section 5(b) of the Banking Regulation Act, 1949?","options":["For the purpose of lending or investment","For government treasury operations","For safekeeping only","For trading in securities"],"correct":0,"explain":"Banking is defined as 'accepting for the purpose of lending or investment, of deposits of money from public.'"}]},{"topic":"Single & Joint Individual Accounts","questions":[{"q":"A single individual account is a purely personal account that is normally operated upon by whom?","options":["Any family member","Only a nominee","The bank manager","The account holder himself"],"correct":3,"explain":"The document states this account 'is normally operated upon by the account holder himself.'"},{"q":"In a single individual account, how can the account holder authorize another person to operate the account?","options":["It is not permitted under any circumstance","By a verbal instruction to the branch staff","By giving Mandate or Power of Attorney","By an SMS request"],"correct":2,"explain":"The account holder 'may authorize another person to operate the account by giving him Mandate or Power of Attorney.'"},{"q":"Why is it desirable to obtain proper nomination on a single individual account?","options":["To avoid legal complications that may arise after the death of the account holder","To waive KYC requirements","To reduce the minimum balance requirement","To enable joint operation of the account"],"correct":0,"explain":"The material states nomination is obtained 'in order to avoid legal complications that may arise after the death of the account holder.'"},{"q":"A joint account of more than one individual is opened for operational convenience or to avoid legal complications arising from which event?","options":["A change of home branch","Retirement of a bank employee","Bankruptcy of the bank","Death of one of the joint account holders"],"correct":3,"explain":"Joint accounts are opened 'for operational convenience or to avoid legal complications upon death of one of the joint account holders.'"},{"q":"In a joint account, who can change addition/deletion of a name, make a material alteration, close the account, or change operational instructions?","options":["The bank alone, at its discretion","Any one account holder","All the account holders jointly","Only the eldest account holder"],"correct":2,"explain":"The material states these actions 'can be changed by all the account holders jointly.'"},{"q":"In a joint account operated with the instruction 'Former or Survivor,' who alone can change or revoke the operating instructions?","options":["Both jointly","The Former","Any one of the account holders","The Survivor"],"correct":1,"explain":"The material states that in joint accounts with 'Former or Survivor' instructions, 'instructions can be changed/revoked only by Former.'"},{"q":"In a joint account with 'Either or Survivor' operating instructions, who can request a Stop Payment on a cheque?","options":["Any one of the account holders","Only the Former","All account holders jointly","Only a nominee"],"correct":0,"explain":"As per the Joint Account Summary table, Stop Payment under 'Either or Survivor' instructions can be requested by 'Any one' account holder."},{"q":"In a joint account with 'Former or Survivor' instructions, payment on maturity of a Fixed Deposit Receipt (FDR) can be made to whom?","options":["All account holders jointly","Only the Former","The Survivor alone","Any one of the account holders"],"correct":1,"explain":"The Joint Account Summary table shows that for 'Former or Survivor' accounts, payment on maturity of an FDR is made to 'Only Former.'"},{"q":"Under all three joint account operating modes shown in the training material (Either or Survivor, Former or Survivor, and Joint Operation), what is required for premature payment of an FDR?","options":["All account holders jointly","Only the Survivor","Any one account holder","Only the Former"],"correct":0,"explain":"The Joint Account Summary table shows 'All jointly' is required for premature payment of FDR under all three operating modes."},{"q":"In 'Joint Operation' mode with a nomination in place, once all original account holders have died, to whom is payment made?","options":["Only to the bank as unclaimed deposit","The survivor and legal heirs, till any of the survivor is alive","Payment stops permanently","Only to the nominee's own legal heirs"],"correct":1,"explain":"The Joint Account Summary table shows payment in case of nomination under 'Joint Operation' goes to 'Survivor and legal heirs till any of survivor is alive.'"}]},{"topic":"Minor Accounts & Guardianship","questions":[{"q":"As per Section 3 of the Indian Majority Act, at what age does a person normally attain majority, except when a guardian is appointed by a Court?","options":["15 years","18 years","16 years","21 years"],"correct":1,"explain":"Section 3 of the Indian Majority Act says a person attains majority at 18, except where a guardian is appointed by a Court, where the age of majority is 21."},{"q":"As per the Indian Contract Act, what is the legal status of a contract entered into with a minor?","options":["The contract is void","The contract is valid only for savings accounts","The contract is valid but voidable","The contract is valid if witnessed"],"correct":0,"explain":"A minor is not under a legal capacity to enter into a contract, and therefore any contract with a minor is void."},{"q":"Section 6(a) of the Hindu Minority and Guardianship Act, 1956 recognizes which persons as the natural guardian of a Hindu minor?","options":["Only the mother","Either of the parents, father or mother","Only a court-appointed relative","Only the father"],"correct":1,"explain":"Section 6(a) of the Hindu Minority and Guardianship Act, 1956 recognizes that either of the parents, father or mother, can be the natural guardian."},{"q":"What type of account should NOT be opened for a minor, as per the training material?","options":["Current Account","Recurring Deposit Account","Fixed Deposit Account","Savings Account"],"correct":0,"explain":"The material states 'No Current Account should be opened' for a minor."},{"q":"In a self-operated minor account, who makes the nomination since the minor cannot?","options":["The guardian of the minor","The bank branch manager","Any relative of the minor","No nomination is possible for minor accounts"],"correct":0,"explain":"A minor cannot make a nomination in a self-operated minor account; nomination is done by the guardian of the minor."},{"q":"Literate minors above what age may be allowed to open and operate savings bank accounts independently, subject to bank-fixed limits?","options":["16 years","10 years","12 years","14 years"],"correct":1,"explain":"The material states 'Literate Minors above the age of 10 years may be now allowed to open and operate savings bank accounts independently.'"},{"q":"When a minor attains the age of majority, who should operate the account?","options":["Only the guardian, until a fresh mandate is filed","The bank operates it in trust until further notice","The guardian continues to operate jointly with the minor","The minor alone; the guardian should not be allowed to operate the account"],"correct":3,"explain":"On attaining majority, the minor alone can operate the account and the guardian should not be allowed to operate the account."},{"q":"Which of the following is one of the three types of guardian listed in the training material?","options":["Corporate Guardian","Statutory Guardian","Testamentary Guardian (appointed by will)","Karta"],"correct":2,"explain":"The three types of guardian listed are Natural Guardian, Testamentary Guardian (appointed by will), and Legal Guardian (appointed by court)."},{"q":"Under Mohammedan Law, who can act as the natural guardian of a Muslim minor's account?","options":["Either parent, as under Hindu law","Any senior family member chosen by consensus","The father (or father's father), not the mother","The mother only"],"correct":2,"explain":"Accounts of Mohammedan minors are operated by the father, who is the natural guardian; the mother cannot act as natural guardian under Mohammedan Law."},{"q":"In the case of a deceased minor's account, to whom is the balance payable, and on production of what document?","options":["To the bank as unclaimed deposit","To the minor's legal heirs without any documentation","To the natural guardian only after 10 years","To the guardian, upon production of the death certificate"],"correct":3,"explain":"In case of death of the minor, the balance is payable to the guardian upon production of the death certificate."}]},{"topic":"Illiterate, Blind & Pardanashin Women Accounts","questions":[{"q":"How is an 'Illiterate person' defined in the training material?","options":["A person below 18 years of age","A person who cannot read or write","A person without a bank account","A person who cannot sign in English"],"correct":1,"explain":"The material states 'Illiterate person is a person who cannot read or write.'"},{"q":"Before opening an account for an illiterate person, who must introduce them to the branch?","options":["A police officer","A notary public","An existing literate account holder of the branch","A chartered accountant"],"correct":2,"explain":"The material states 'The illiterate person will have to be introduced by an existing literate account holder of the branch.'"},{"q":"Which thumb impression is normally obtained from a male illiterate person for entering into an agreement with the bank?","options":["Left Hand Thumb impression (LHT)","No specific thumb is prescribed","Both thumb impressions","Right Hand Thumb impression (RHT)"],"correct":0,"explain":"The material states 'Normally, Left Hand Thumb impression (LHT) of male & Right Hand Thumb impression (RHT) of female is to be obtained.'"},{"q":"Who can attest the thumb impression of an illiterate person on the account opening form?","options":["A local shopkeeper","A judicial officer or bank official or a witness who is also an account holder of the bank","Any relative of the account holder","A neighbour of the account holder"],"correct":1,"explain":"The material states the thumb impression 'has to be attested by a judicial officer or bank official or any witness who is also the account holder of the bank.'"},{"q":"How many witnesses are required for nomination in the case of an illiterate customer?","options":["Two witnesses","One witness","Three witnesses","No witness is required"],"correct":0,"explain":"The material states 'Two witnesses required for nomination' for illiterate persons."},{"q":"For an illiterate customer, who is NOT permitted to fill up the withdrawal slip?","options":["Another customer of the bank","No bank employee should fill it up","The illiterate customer's own family member","A witness known to the bank"],"correct":1,"explain":"The material states 'No bank employee should fill up the withdrawal slip for the illiterate customer and he can be assisted by any other customer of the bank.'"},{"q":"For a blind person's account, who must witness the signature or thumb impression on the account opening form?","options":["Only a family member of the blind person","No witness is required","Only the branch manager","A person who certifies that the contents of the form were explained to the blind person in his presence"],"correct":3,"explain":"The material states the signature/thumb impression 'to be witnessed by a person who should certify that contents of the A/c opening form were explained to the blind person in his presence.'"},{"q":"A blind person should always visit the branch personally for which transaction, per the training material?","options":["Passbook updation","Balance enquiry","Cash withdrawal","Cheque book request"],"correct":2,"explain":"The material states 'He should always visit the branch for cash withdrawal.'"},{"q":"What best describes a 'Pardanashin woman' according to the training material?","options":["A woman who has never opened a bank account","A widow with no legal heirs","A woman above the age of 60","A lady who remains in complete seclusion and does not transact business with people other than her own family members"],"correct":3,"explain":"The material defines a Pardanashin woman as 'a lady who remains in complete seclusion & does not transact any business with people other than her own family members.'"},{"q":"Normally, what type of account is NOT opened in the name of a Pardanashin woman?","options":["Current Account","Savings Account","Recurring Deposit Account","Fixed Deposit Account"],"correct":0,"explain":"The material states 'Normally no current account is opened' for a Pardanashin woman."}]},{"topic":"Hindu Undivided Family (HUF)","questions":[{"q":"As per Hindu law, which communities can form a Hindu Undivided Family (HUF)?","options":["Hindus, Sikhs & Jains","Hindus and Muslims","Only Hindus","All Indian citizens regardless of religion"],"correct":0,"explain":"The material states 'As per Hindu law, the Hindus, Sikhs & Jains can form HUF.'"},{"q":"HUF is governed by two schools of thought. In Bengal, HUF is governed by which law?","options":["Common Law","Mitakshara Law","Shariat Law","Dayabhag law"],"correct":3,"explain":"The material states 'In Bengal, it is governed by Dayabhag law; in other parts of India, it is governed by Mitakshara Law.'"},{"q":"In an HUF, the joint owners are known by what term?","options":["Shareholders","Coparceners","Directors","Trustees"],"correct":1,"explain":"The material states 'Joint owner of HUF are known as coparceners.'"},{"q":"Who manages the HUF property, as the senior-most major male member of the family?","options":["The Manager or Karta","A court-appointed administrator","The eldest coparcener's wife","The bank manager"],"correct":0,"explain":"The material states 'HUF property is managed by senior most major male member called Manager or Karta.'"},{"q":"As per which Supreme Court judgement, cited in the training material, can an HUF NOT enter into a partnership?","options":["Supreme Court judgement of 1956","Supreme Court judgement of 1998","Supreme Court judgement of 1972","Supreme Court judgement of 2005"],"correct":1,"explain":"The material states 'HUF cannot enter into a partnership as per Supreme Court judgement of 1998.'"},{"q":"What document must be signed by the Karta and all the coparceners when opening an HUF account?","options":["Partnership Deed","Joint Hindu Family Letter (CD-115)","Trust Deed","Memorandum of Association"],"correct":1,"explain":"The material states 'Joint Hindu Family Letter (CD-115) to be signed by Karta & all the coparceners.'"},{"q":"If the PAN of the HUF is not available, whose PAN should at least be obtained?","options":["The Karta's PAN","No PAN is required in this case","Any coparcener's PAN","The eldest coparcener's PAN"],"correct":0,"explain":"The material states 'PAN of HUF required, if not at least Karta should have PAN.'"},{"q":"Does the death of a coparcener dissolve the HUF?","options":["Only if all coparceners agree to dissolve it","Yes, the HUF is automatically dissolved","No, death of a coparcener does not dissolve the HUF","Only if the deceased was the Karta"],"correct":2,"explain":"The material states 'Death of coparcener does not dissolve HUF,' though it is advisable to obtain a fresh CD-115 letter on such an event."},{"q":"From when are female descendants included as coparceners in an HUF, per the training material?","options":["The date is not specified","January 1956","April 2013","September 2005"],"correct":3,"explain":"The material states the HUF consists of a common ancestor and 'his all male & female (female from Sept. 2005) descendents up to 3 generation next to him.'"},{"q":"Under which sections of the Income Tax Act can an HUF account avail tax rebates and deductions, per the training material?","options":["Sections 194A and 194C","Sections 10, 12 and 15","Sections 80C, 88 and 80L","Sections 44AB and 44AD"],"correct":2,"explain":"The material states 'According to IT act, tax rebates and deductions can be availed under sections 80C, 88 and 80L for HUF account.'"}]},{"topic":"Proprietorship Firms","questions":[{"q":"In a proprietorship firm, the business is wholly owned by whom?","options":["Shareholders","A group of partners","An individual","A trust"],"correct":2,"explain":"The material states 'Business is wholly owned by an individual' in a proprietorship firm."},{"q":"In law, what is the relationship between a proprietor and the proprietorship firm?","options":["The firm is taxed separately from the proprietor","There is no difference between the proprietor and the firm","They are two distinct legal entities","The firm has limited liability separate from the proprietor"],"correct":1,"explain":"The material states 'In law, there is no difference between proprietor & the firm.'"},{"q":"What must be obtained from the proprietor in the bank's prescribed format when opening a proprietorship account?","options":["Trust deed","Partnership deed","Proprietorship letter in the bank's Performa","Memorandum of Association"],"correct":2,"explain":"The material states 'Proprietorship letter in bank's Performa is to be obtained.'"},{"q":"A proprietorship firm's account is, in all respects, an account in the name of whom?","options":["An individual, operated upon by the proprietor on behalf of the firm","A registered company","A cooperative society","A joint venture of multiple owners"],"correct":0,"explain":"The material states 'In all respects, it is an account in the name of an individual only except that it is operated upon by the proprietor on behalf of firm.'"},{"q":"What registration does the training material state a proprietorship firm should have?","options":["GST Number","Certificate of Incorporation","Company Identification Number (CIN)","LLP registration"],"correct":0,"explain":"The material states 'The firm should have GST No.'"},{"q":"In case of a proprietorship firm's debts, against which assets do creditors have recourse?","options":["Both the assets of the firm and the private assets of the proprietor","Only the private assets of the proprietor's family members","Only the assets of the firm","No recourse is available since liability is limited"],"correct":0,"explain":"The material states 'Creditors have recourse not only against assets of the firm but also against private assets of the proprietor.'"},{"q":"In what capacity must a proprietor execute security documents for the bank?","options":["Only as Proprietor on behalf of the firm","Through an appointed company director","Only in his individual capacity","As Proprietor on behalf of the firm, as well as in his individual capacity"],"correct":3,"explain":"The material states the bank insists 'that proprietor should execute the security documents in the capacity as Proprietor on behalf of the firm as well as in his individual capacity.'"},{"q":"How can a proprietor authorise another person to operate the firm's bank account?","options":["It is not permitted for proprietorship firms","Through Mandate or Power of Attorney","Only through a partnership deed","Only through a board resolution"],"correct":1,"explain":"The material states 'Proprietor can authorise another person to operate the account through Mandate or Power of Attorney.'"},{"q":"Along with the KYC Official Valid Documents of the proprietor, how many additional documents from the prescribed list must be obtained to establish proof of proprietorship?","options":["All of the followings","Any five of the followings",
